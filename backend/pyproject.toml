[project]
name = "whoisspy-backend"
version = "0.2.0"
description = "多 AI 合作对抗观赏台 - 后端（headless 对局引擎，狼人杀首发）"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20", "openai>=1.40", "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100